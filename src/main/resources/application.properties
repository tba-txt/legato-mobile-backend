spring.application.name=legato_api

server.port=8082
server.forward-headers-strategy=framework
app.base-url=${APP_BASE_URL:http://localhost:8082}

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
logging.level.org.flywaydb=DEBUG

# --- CONEXAO BANCO DE DADOS ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update

# --- SEGURANCA ---
api.security.token.secret=${JWT_SECRET}
google.recaptcha.secret=${RECAPTCHA_SECRET:chave_secreta_padrao}

# --- CLOUDINARY ---
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# --- SPOTIFY ---
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}

# --- SMTP (EMAIL) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Ajustes do Hikari para Banco Serverless (Neon DB)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000